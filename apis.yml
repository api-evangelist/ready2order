- aid: ready2order:ready2order-coupon-api
  name: Ready2order Coupon API
  description: >-
    <!-- markdownlint-disable MD041 MD033 MD051 github-internal-links relative-links -- tag description
    snippet, not a standalone document; the tag name serves as the heading in the API docs -->

    Coupons are gift cards and vouchers that merchants sell and later accept as payment at the point of
    sale. The `coupon_value` field always holds the current remaining balance.


    **Balance and Lifecycle**


    You create a coupon with an initial value. From there you can [charge it](#operation/couponChargeById)
    (add value) or [redeem it](#operation/couponRedeemById) (deduct value). Partial redemptions work fine;
    the coupon stays active until the balance reaches zero.


    **Coupon Purpose**


    `coupon_purpose` determines when VAT is due. We distinguish between two voucher types:


    | Purpose | When VAT is due | `coupon_containsVat` |

    |---------|-----------------|----------------------|

    | `single` | At issuance (place of supply and tax rate are known at creation) | The applicable rate,
    e.g. `20` |

    | `multi` | At redemption (the POS applies the right rate per item) | Must be `0` |


    Single-purpose suits vouchers for specific goods at a fixed rate, such as a drink voucher tied to
    a particular product.<br>

    Multi-purpose fits general gift cards redeemable for anything or across multiple locations.


    Check with your tax advisor which type applies to your situation.


    **Identifier**


    `coupon_identifier` is the numeric code printed on physical voucher cards. If you leave it out, an
    EAN-13 code is generated automatically. Pass it as the `identifier` query parameter on [GET /coupons](#operation/couponGetAll)
    to look up a coupon by barcode scan.
  humanURL: https://ready2order.com/api/doc
  baseURL: https://api.ready2order.com/v1
  tags:
  - Coupon
  properties:
  - type: OpenAPI
    url: openapi/ready2order-coupon-api-openapi.yml
  - type: Documentation
    url: https://ready2order.com/api/doc
  - type: APIReference
    url: https://ready2order.com/api/doc
- aid: ready2order:ready2order-coupon-category-api
  name: Ready2order Coupon Category API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    Coupon categories let you group coupons under a shared label. The category has no effect on coupon
    behaviour or tax treatment.


    To assign a coupon to a category, set `couponCategory_id` when [creating](#operation/couponCreate)
    or [updating](#operation/couponUpdateById) the coupon. You cannot delete a category that still has
    coupons assigned to it.
  humanURL: https://ready2order.com/api/doc
