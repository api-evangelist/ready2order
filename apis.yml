- aid: ready2order:ready2order-printer-api
  name: Ready2order Printer API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    Printers represent the physical printing devices registered to an account — including receipt printers,
    mobile printers, and all-in-one terminals. They are configured through the ready2order POS or dashboard;
    the public API is read-only except for triggering a test print.


    **Fields**


    | Field | Description |

    |-------|-------------|

    | `printer_id` | System-assigned unique identifier for the printer |

    | `printer_name` | The name assigned to the printer in the account settings |

    | `printer_description` | Optional free-text description |

    | `printer_deviceName` | The OS-level device name used to address the printer |

    | `printer_model` | The hardware model, for example `TM-T20II` or `mC-Print3` |

    | `printer_manufacturer` | The manufacturer, for example `epson` or `star` |

    | `printer_ipAddress` | **Deprecated.** The connection address for the printer: an IP address for
    network printers, a MAC address for Bluetooth, a device path (e.g. `/dev/usb/lp0`) for USB, or `ready2print`
    for OS-managed printers. `null` if not yet configured |

    | `printer_characters` | The number of characters per printed line, which determines print width |

    | `printer_doubleHeight` | Whether characters are printed at double height |

    | `printer_createdAt` | Timestamp when the printer record was created |


    **Printer profiles**


    A printer profile (see [Printer Profile](#tag/Printer-Profile)) is a named logical slot that sits
    between your POS configuration and a physical printer. Assigning print jobs to a profile rather than
    to a printer directly means you can swap out hardware without reconfiguring the rest of the system.
    Each profile lists the physical printer IDs it currently maps to in `printingProfile_associatedPhysicalPrinterIds`.


    **Cash drawer**


    Some printers support opening a connected cash drawer via an RJ11 kick signal. This is configured
    per printer in the account settings. See the [create bill](#operation/billCreateBill) endpoint for
    how to trigger it via the API.
  humanURL: https://ready2order.com/api/doc
  baseURL: https://api.ready2order.com/v1
  tags:
  - Printer
  properties:
  - type: OpenAPI
    url: openapi/ready2order-printer-api-openapi.yml
  - type: Documentation
    url: https://ready2order.com/api/doc
  - type: APIReference
    url: https://ready2order.com/api/doc
- aid: ready2order:ready2order-printer-profile-api
  name: Ready2order Printer Profile API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    A printer profile is a named stand-in for a physical printer. The POS targets profiles by name rather
    than by hardware ID, so you can replace a physical printer in the account settings without any change
    to your POS configuration.


    Each profile can be linked to one or more physical printers. When a job targets a profile, all linked
    printers receive it simultaneously. The IDs of the linked printers are returned in `printingProfile_associatedPhysicalPrinterIds`.


    **Fields**


    | Field | Description |

    |-------|-------------|

    | `printingProfile_id` | System-assigned unique identifier for the printer profile |

    | `printingProfile_name` | The name assigned to this profile, for example `Kitchen` or `Bar` |

    | `printingProfile_associatedPhysicalPrinterIds` | The [physical printers](#tag/Printer) currently
    linked to this profile |
  humanURL: https://ready2order.com/api/doc
  baseURL: https://api.ready2order.com/v1
  tags:
  - Printer Profile
  properties:
  - type: OpenAPI
    url: openapi/ready2order-printer-profile-api-openapi.yml
  - type: Documentation
    url: https://ready2order.com/api/doc
  - type: APIReference
    url: https://ready2order.com/api/doc
- aid: ready2order:ready2order-product-api
  name: Ready2order Product API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    Products are the items sold at the point of sale. Each product belongs to a product group and carries
    a price, a VAT rate, and a set of optional features such as stock tracking, variations, and ingredients.


    **Identifiers**


    A product supports three optional identifiers alongside its system `product_id`:


    - `product_itemnumber`: the merchant's own article number, used on labels, in exports, and for stock
    lookups

    - `product_barcode`: EAN or barcode for scanning at the POS

    - `product_externalReference`: for integrators to store their own system's ID, so you can map between
    your records and ready2order without storing `product_id` on your side


    **Pricing and VAT**


    `product_price` is the base price. Set `product_priceIncludesVat` to `true` (the default) if that
    figure is gross, or `false` if it is net. A VAT rate is required on creation — supply either `product_vat`
    as a percentage or `product_vat_id` referencing a [VAT rate](#tag/Vat-Rate).


    Customers and customer categories can have individual price overrides managed via the [per-customer
    prices](#operation/productGetAllCustomerProductPrices) and [per-category prices](#operation/productGetAllCustomerCategoryProductPrices)
    endpoints.


    **Custom price and quantity**


    Set `product_customPrice: true` to let the cashier enter the price manually at checkout, which is
    useful for open-price items. `product_customQuantity: true` does the same for the quantity.


    **Stock**


    Stock tracking is optional and configured per product. Set `product_stock_enabled: true`, then use
    `product_stock_value` for the current quantity, `product_stock_safetyStock` for the minimum threshold,
    and `product_stock_reorderLevel` for the point at which the system alerts about low inventory. Use
    the [get stock](#operation/productGetStock) and [update stock](#operation/productUpdateStock) endpoints
    to read or update stock figures without touching other product fields.


    **Product type**


    `product_type` is mainly relevant in gastro mode, where it drives printer routing (e.g. kitchen vs.
    bar). Available values: `standard`, `food`, `drink`, `extra`, `sidedish`, `variation`, `ingredient`.
    For standard retail products, use `standard`.


    **Variations and ingredients**


    Variations (selectable add-ons or modifications) and ingredients (component tracking for recipes and
    partial-unit sales) are enabled per product with `product_variations_enabled` and `product_ingredients_enabled`.
    Both require the corresponding feature to be active on the account.


    **Keeping a catalogue in sync**


    The recommended approach is to subscribe to [webhooks](#tag/Webhook) for `product.created` and `product.updated`
    events. This avoids polling and ensures your system is updated in near real-time without unnecessary
    requests.


    If webhooks are not an option, use the `updatedAfter` query parameter on [list products](#operation/productGetAll)
    to fetch only products changed since a given timestamp. Use [batch create](#operation/productCreateBatch)
    to create multiple products in one request.
  humanURL: https://ready2order.com/api/doc
  baseURL: https://api.ready2order.com/v1
  tags:
  - Product
  properties:
  - type: OpenAPI
    url: openapi/ready2order-product-api-openapi.yml
  - type: Documentation
    url: https://ready2order.com/api/doc
  - type: APIReference
    url: https://ready2order.com/api/doc
