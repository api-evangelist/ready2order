- aid: ready2order:ready2order-discount-api
  name: Ready2order Discount API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    Discounts are preset price reductions that cashiers can apply at the point of sale. Unlike coupons,
    they are not financial instruments; they simply reduce the sale price, with VAT calculated on the
    reduced amount.


    Every discount belongs to a group via `discountGroup_id`. The group determines how discounts are organised
    and presented at the POS. You need at least one [discount group](#operation/discountGroupCreateDiscountGroup)
    before you can create a discount.


    **Discount unit**


    `discount_unit` controls how the reduction is calculated:


    | Unit | Behaviour | `discount_value` |

    |------|-----------|-----------------|

    | `percent` | Reduces the price by a percentage | 0–100 |

    | `currency` | Reduces the price by a fixed amount | Any positive number |

    | `custom` | The cashier enters the amount at checkout | Not required |


    **Visibility and ordering**


    Set `discount_active` to `false` to hide a discount at the POS without deleting it. `discount_order`
    controls the position in the list shown to cashiers.
  humanURL: https://ready2order.com/api/doc
  baseURL: https://api.ready2order.com/v1
  tags:
  - Discount
  properties:
  - type: OpenAPI
    url: openapi/ready2order-discount-api-openapi.yml
  - type: Documentation
    url: https://ready2order.com/api/doc
  - type: APIReference
    url: https://ready2order.com/api/doc
- aid: ready2order:ready2order-discount-group-api
  name: Ready2order Discount Group API
  description: >-
    <!-- markdownlint-disable MD041 MD051 github-internal-links relative-links -- tag description snippet,
    not a standalone document; the tag name serves as the heading in the API docs -->

    Discount groups organise discounts into named collections. Every discount must belong to a group,
    so you need at least one group before you can create discounts.


    Setting `discountGroup_active` to `false` hides all discounts in the group at the POS, which is useful
    for seasonal or temporarily suspended promotions.


    A group cannot be deleted while it still contains discounts. [Delete](#operation/discountDelete) or
    move the discounts out of the group first.
