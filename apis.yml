aid: ready2order
name: Ready2order
description: >-
  ready2order is an Austrian cloud point-of-sale (POS) system for small businesses in gastronomy,
  retail, and services, running on tablets, phones, computers, and dedicated terminals. Its Public
  API (v1) lets integrations manage the full POS surface — products and product groups, stock, orders
  and tables, bills/invoices, customers and customer groups, coupons, discounts, payment methods,
  printing, daily reports, and accounting exports — secured with a Bearer Account Token and kept in
  sync through 17 push webhook events. The platform is tax-office compliant for Austria, Germany, and
  Switzerland. Surfaced as a portfolio company of Speedinvest and enriched into the API Evangelist
  network from its published OpenAPI and developer documentation.
