openapi: 3.2.0
info:
  title: ready2order Public Currency API
  contact:
    name: support@ready2order.com
  license:
    name: proprietary
  version: R2-2026.30.2
  description: '# First Steps


    ## Authorization


    The ready2order API uses a three-token flow to grant your integration access to a ready2order account.'
servers:
- url: https://api.ready2order.com/v1
tags:
- name: Currency
paths:
  /currencies:
    get:
      tags:
      - Currency
      summary: Get Currencies
      description: ''
      operationId: currencyGetCurrencies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  properties:
                    currency_id:
                      type: integer
                      example: 1
                    currency_name:
                      type: string
                      example: Euro
                    currency_short:
                      type: string
                      example: EUR
                  type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - Bearer: []
  /currencies/{id}:
    get:
      tags:
      - Currency
      summary: Get Currency
      description: ''
      operationId: currencyGetCurrency
      parameters:
      - name: id
        in: path
        description: Currency ID to find
        required: true
        schema:
          type: integer
          example: 123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  currency_id:
                    type: integer
                    example: 1
                  currency_name:
                    type: string
                    example: Euro
                  currency_short:
                    type: string
                    example: EUR
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
components:
  securitySchemes:
    Bearer:
      type: apiKey
      description: Account Token obtained after completing the authorization flow. See First Steps for details.
      name: Authorization
      in: header
