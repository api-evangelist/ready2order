                                type: string
                                example: 1030
                              city:
                                type: string
                                example: WIen
                              street:
                                type: string
                                example: Straße 1
                              country:
                                type: string
                                example: AT
                              email:
                                type: string
                                example: example@ready2order.com
                              phone:
                                type: string
                                example: +43 664 12345678
                            type: object
                      type: object
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
    put:
      tags:
      - Customer
      summary: Update Customer by Id
      description: ''
      operationId: customerUpdate
      parameters:
      - name: id
        in: path
        description: Customer ID to update
        required: true
        schema:
          type: integer
          example: 12345
      requestBody:
        content:
          application/json:
            schema:
              properties:
                customerCategory_id:
                  type: integer
                  example: 1126
                birthday:
                  type: string
                  example: '1991-09-20'
                city:
                  type: string
                  example: Wien
                company:
                  type: string
                  example: Maxi Gmbh
                email:
                  type: string
                  example: example@ready2order.com
                firstName:
                  type: string
                  example: Max
                lastName:
                  type: string
                  example: Muster
                customer_name:
                  type: string
                notes:
                  type: string
                  example: Some custom notes
                customer_number:
                  type: integer
                  example: 9999
                phone:
                  type: string
                  example: +43 12345678
                salutation:
                  type: string
                  example: Herr
                street:
                  type: string
                  example: Straße 1
                title:
                  type: string
                  example: Herr
                uid:
                  type: string
                  example: ATU1234567
                zip:
                  type: string
                  example: 1030
                address:
                  type: array
                  items: []
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  customer_id:
                    type: integer
                    example: 9999
                  customer_number:
                    type: integer
                    example: 9999
                  customer_name:
                    type: string
                    example: Maxi's custom name
                  vatId:
                    type: string
                    example: ATU1234567
                  customer_notes:
                    type: string
                    example: Some custom notes
                  customerCategory_id:
                    type: integer
                    example: 9999
                  customer_birthday:
                    type: string
                    example: '1991-09-20'
                  address:
                    type: array
                    items:
                      properties:
                        invoice:
                          type: array
                          items:
                            properties:
                              salutation:
                                type: string
                                example: Herr
                              title:
                                type: string
                                example: Professor
                              customer_company:
                                type: string
                                example: Maxi Gmbh
                              lastName:
                                type: string
                                example: Muster
                              firstName:
                                type: string
                                example: Max
                              zip:
                                type: string
                                example: 1030
                              city:
                                type: string
                                example: WIen
                              street:
                                type: string
                                example: Straße 1
                              country:
                                type: string
                                example: AT
                              email:
                                type: string
                                example: example@ready2order.com
                              phone:
                                type: string
                                example: +43 664 12345678
                            type: object
                      type: object
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
    delete:
      tags:
      - Customer
      summary: Delete Customer by Id
      description: ''
      operationId: customerDelete
      parameters:
      - name: id
        in: path
        description: Customer ID to delete
        required: true
        schema:
          type: integer
          example: 12345
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: boolean
                    example: false
                  success:
                    type: boolean
                    example: true
                  msg:
                    type: string
                    example: Customer was successfully deleted!
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
  /customers/merge:
    post:
      tags:
      - Customer
      summary: Merge Customers
      description: ''
      operationId: customerMergeCustomers
      requestBody:
        content:
          application/json:
            schema:
              required:
              - masterCustomer
              - customerIds
              properties:
                masterCustomer:
                  description: Customer into which the list of customerIds should be merged into.
                  type: integer
                  example: 5924
                customerIds:
                  description: List of customers which shall be merged into masterCustomer.
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                  - 4
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: boolean
                    example: false
                  success:
                    type: boolean
                    example: true
                  msg:
                    type: string
                    example: Merged successfully!
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - Bearer: []
components:
  securitySchemes:
    Bearer:
      type: apiKey
      description: Account Token obtained after completing the authorization flow. See First Steps for details.
      name: Authorization
      in: header
