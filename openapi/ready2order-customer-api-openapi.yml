- url: https://api.ready2order.com/v1
tags:
- name: Customer
paths:
  /customers:
    get:
      tags:
      - Customer
      summary: List all Customers
      description: ''
      operationId: customerGetAll
      parameters:
      - name: page
        in: query
        description: Page you want to display
        required: false
        schema:
          type: integer
          example: 1
      - name: limit
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          example: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  properties:
                    customer_id:
                      type: integer
                      example: 9999
                    customer_number:
                      type: integer
                      example: 9999
                    customer_name:
                      type: string
                      example: Maxi's custom name
                    vatId:
                      type: string
                      example: ATU1234567
                    customer_notes:
                      type: string
                      example: Some custom notes
                    customerCategory_id:
                      type: integer
                      example: 9999
                    customer_birthday:
                      type: string
                      example: '1991-09-20'
                    address:
                      type: array
                      items:
                        properties:
                          invoice:
                            type: array
                            items:
                              properties:
                                salutation:
                                  type: string
                                  example: Herr
                                title:
                                  type: string
                                  example: Professor
                                customer_company:
                                  type: string
                                  example: Maxi Gmbh
                                lastName:
                                  type: string
                                  example: Muster
                                firstName:
                                  type: string
                                  example: Max
                                zip:
                                  type: string
                                  example: 1030
                                city:
                                  type: string
                                  example: WIen
                                street:
                                  type: string
                                  example: Straße 1
                                country:
                                  type: string
                                  example: AT
                                email:
                                  type: string
                                  example: example@ready2order.com
                                phone:
                                  type: string
                                  example: +43 664 12345678
                              type: object
                        type: object
                  type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - Bearer: []
    post:
      tags:
      - Customer
      summary: Create a new Customer
      description: ''
      operationId: customerCreate
      requestBody:
        content:
          application/json:
            schema:
              required:
              - customerCategory_id
              properties:
                customerCategory_id:
                  type: integer
                  example: 1126
                birthday:
                  type: string
                  example: '1991-09-20'
                city:
                  type: string
                  example: Wien
                company:
                  type: string
                  example: Maxi Gmbh
                email:
                  type: string
                  example: example@ready2order.com
                firstName:
                  type: string
                  example: Max
                lastName:
                  type: string
                  example: Muster
                customer_name:
                  type: string
                notes:
                  type: string
                  example: Some custom notes
                customer_number:
                  type: integer
                  example: 9999
                phone:
                  type: string
                  example: +43 12345678
                salutation:
                  type: string
                  example: Herr
                street:
                  type: string
                  example: Straße 1
                title:
                  type: string
                  example: Herr
                uid:
                  type: string
                  example: ATU1234567
                zip:
                  type: string
                  example: 1030
                address:
                  type: array
                  items: []
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  customer_id:
                    type: integer
                    example: 9999
                  customer_number:
                    type: integer
                    example: 9999
                  customer_name:
                    type: string
                    example: Maxi's custom name
                  vatId:
                    type: string
                    example: ATU1234567
                  customer_notes:
                    type: string
                    example: Some custom notes
                  customerCategory_id:
                    type: integer
                    example: 9999
                  customer_birthday:
                    type: string
                    example: '1991-09-20'
                  address:
                    type: array
                    items:
                      properties:
                        invoice:
                          type: array
                          items:
                            properties:
                              salutation:
                                type: string
                                example: Herr
                              title:
                                type: string
                                example: Professor
                              customer_company:
                                type: string
                                example: Maxi Gmbh
                              lastName:
                                type: string
                                example: Muster
                              firstName:
                                type: string
                                example: Max
                              zip:
                                type: string
                                example: 1030
                              city:
                                type: string
                                example: WIen
                              street:
                                type: string
                                example: Straße 1
                              country:
                                type: string
                                example: AT
                              email:
                                type: string
                                example: example@ready2order.com
                              phone:
                                type: string
                                example: +43 664 12345678
                            type: object
                      type: object
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - Bearer: []
  /customers/{id}:
    get:
      tags:
      - Customer
      summary: Find Customer by Id
      description: ''
      operationId: customerFindById
      parameters:
      - name: id
        in: path
        description: Customer ID to find
        required: true
        schema:
          type: integer
          example: 123456
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  customer_id:
                    type: integer
                    example: 9999
                  customer_number:
                    type: integer
                    example: 9999
                  customer_name:
                    type: string
                    example: Maxi's custom name
                  vatId:
                    type: string
                    example: ATU1234567
                  customer_notes:
                    type: string
                    example: Some custom notes
                  customerCategory_id:
                    type: integer
                    example: 9999
                  customer_birthday:
                    type: string
                    example: '1991-09-20'
                  address:
                    type: array
                    items:
                      properties:
                        invoice:
                          type: array
                          items:
                            properties:
                              salutation:
                                type: string
                                example: Herr
                              title:
                                type: string
                                example: Professor
                              customer_company:
                                type: string
                                example: Maxi Gmbh
