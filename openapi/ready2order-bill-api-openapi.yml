    post:
      tags:
      - Bill
      summary: Create Bill
      description: ''
      operationId: billCreateBill
      requestBody:
        content:
          application/json:
            schema:
              required:
              - paymentMethod_id
              - user_id
              properties:
                paymentMethod_id:
                  description: PaymentMethod ID. Whether the bill is marked as paid depends on the payment method type — payment methods with markAsPaid=true will automatically mark the bill as paid.
                  type: integer
                  example: 123456
                user_id:
                  description: User ID
                  type: integer
                  example: 123456
                partPayments:
                  description: List of part-payments to split the bill total into multiple payments
                  type: array
                  items:
                    properties:
                      paymentMethod_id:
                        description: PaymentMethod ID of this payment
                        type: integer
                        example: 123456
                      amount:
                        description: Amount paid with this payment method
                        type: string
                        example: 5
                      tip:
                        description: Tip paid with this payment method
                        type: string
                        example: 1
                      couponIdentifier:
                        description: Identifier of the coupon to redeem (only for payment methods of type coupon)
                        type: string
                        example: COUPON-123
                    type: object
                table_id:
                  description: Table ID
                  type: integer
                  example: 4321
                customer_id:
                  description: Customer ID
                  type: integer
                  example: 1024
                billType_id:
                  description: BillType ID
                  type: integer
                  example: 1
                printer_id:
                  description: Printer ID on which the bill should be printed
                  type: integer
                  example: 1
                printingProfile_id:
                  description: PrintingProfile ID on which the bill should be printed.
                  type: integer
                  example: 1
                invoice_printCount:
                  description: Number of copies to be printed (where 1 is the original receipt)
                  type: integer
                  example: 2
                invoice_textBeforeItemsTable:
                  description: Text shown before items table on bill PDF
                  type: string
                  example: Some text
                invoice_text:
                  description: Text shown after items table on bill PDF
                  type: string
                  example: Some text
                invoice_externalReferenceNumber:
                  description: External reference number for the bill
                  type: string
                  example: REF-1234
                invoice_totalTip:
                  description: Total tip amount for the invoice.
                  type: string
                  example: 1.5
                invoice_priceBase:
                  description: Pricebase
                  type: string
                  enum:
                  - gross
                  - net
                  example: gross or net
                invoice_testMode:
                  description: Trainingmode
                  type: boolean
                  example: false
                createPDF:
                  description: Whether to create and return PDF or not
                  type: boolean
                  example: false
                pdfFormat:
                  description: PDF format
                  type: string
                  example: A4, 80mm or 58mm
                invoice_showRecipient:
                  description: Show additional lines on invoice receipt
                  type: boolean
                  example: false
                invoice_dueDate:
                  description: Due date
                  type: string
                  example: '2019-01-15'
                items:
                  description: List of items <br><br> _* Required if `orderItem_ids` is not provided._
                  type: array
                  items:
                    properties:
                      item_quantity:
                        type: string
                        default: 1
                        example: 3
                      item_name:
                        type: string
                        example: MyProductName
                      item_comment:
                        type: string
                        example: MyProductDescription
                      item_price:
                        type: string
                        example: 12
                      item_vatRate:
                        description: Please use vatId instead
                        type: string
                        example: 20
                      item_vatId:
                        type: integer
                        example: 12345
                      item_priceBase:
                        type: string
                        example: brutto or netto
                      product_id:
                        type: integer
                        example: 1234
                      discount_id:
                        type: integer
                        example: 1234
                      discount_value:
                        type: string
                        example: 0
                      discount_unit:
                        type: string
                        example: percent or currency
                      item_variations:
                        description: List of product variations
                        type: array
                        items:
                          properties:
                            product_id:
                              description: Id of product variation
                              type: integer
                              example: 1
                            variation_name:
                              description: Product variation name
                              type: string
                              example: Schnitzel with chips and mayo
                            variation_price:
                              description: Product variation price
                              type: string
                              example: 15.2
                          type: object
                    type: object
                orderItem_ids:
                  description: List of orderItemIds to process the invoice for <br><br> _* Required if `items` is not provided._
                  type: array
                  items:
                    type: integer
                  example:
                  - 1
                  - 2
                  - 3
                address:
                  description: Address object
                  type: array
                  items:
                    properties:
                      company:
                        type: string
                        example: ready2order GmbH
                      vatId:
                        type: string
                        example: ATU12341234
                      leitweg_id:
                        type: string
                        example: 1234
                      supplier_number:
                        type: string
                        example: 1234
                      salutation:
                        type: string
                        example: Mr/Mrs
                      title:
                        type: string
                        example: Professor
                      firstName:
                        type: string
                        example: Chris
                      lastName:
                        type: string
                        example: Muster
                      street:
                        type: string
                        example: SomeStreet 1234
                      city:
                        type: string
                        example: Vienna
                      zip:
                        type: string
                        example: 1030
                      country:
                        type: string
                        example: AT
                      email:
                        type: string
                        example: dummy@email.com
                      phone:
                        type: string
                        example: +43 1234 12312341234
                    type: object
                invoice_discounts:
                  description: List of invoice-level discounts
                  type: array
                  items:
                    properties:
                      invoice_discountId:
                        description: Discount ID
                        type: integer
                        example: 1234
                      invoice_discountValue:
                        description: Discount value (must be negative)
                        type: string
                        example: -5.5
                      invoice_discountUnit:
                        description: Discount unit
                        type: string
                        example: percent or currency
                    type: object
                order_enablePrinting:
                  description: Whether to print the order receipts (foods, drinks) for the bill (if configured)
                  type: boolean
                  example: true
                priceLevel_id:
                  description: PriceLevel ID
                  type: integer
                  example: 255
                invoice_roundToSmallestCurrencyUnit:
                  description: Rounding to 0.05 or 0.10 cents
                  type: string
                  example: 0.05, 0.1
              type: object
