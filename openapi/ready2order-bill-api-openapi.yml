        required: false
        schema:
          type: string
          example: RG2018/1
      - name: tableId
        in: query
        description: Table-Id to filter by.
        required: false
        schema:
          type: integer
          example: 153311
      - name: customerId
        in: query
        description: Customer-Id to filter by.
        required: false
        schema:
          type: integer
          example: 27268
      - name: dateField
        in: query
        description: Date field the query should filter by. <br><br> __Values__<br> `daily_report` Filter by the start date of the related Daily Report<br> `bill` Filter by the bill’s creation date
        required: false
        schema:
          type: string
          default: daily_report
          enum:
          - daily_report
          - dr_startDate
          - bill
          - b_dateTime
          example: daily_report
      - name: dateFrom
        in: query
