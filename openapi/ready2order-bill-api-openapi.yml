  /document/invoice/{id}/print:
    post:
      tags:
      - Bill
      summary: Print a bill
      description: Add bill to printer queue for specific printer
      operationId: billPrint
      parameters:
      - name: id
        in: path
        description: Bill ID to find
        required: true
        schema:
          type: integer
          example: 123456
      requestBody:
        content:
          application/json:
            schema:
              properties:
                printer_id:
                  description: Printer ID where to print the bill <br><br> _* Required if none of `printingProfile_id` are provided._
                  type: integer
                  example: 2394
                printingProfile_id:
                  description: PrintingProfile ID on which the bill should be printed. <br><br> _* Required if none of `printer_id` are provided._
                  type: integer
                  example: 1
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: boolean
                    example: false
                  msg:
                    type: string
                    example: Bill was added to printer queue
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
  /document/invoice/{id}/pdf:
    get:
      tags:
      - Bill
      summary: Create PDF for bill
      description: Returns signed S3 URL. Optionally regenerates pdf if `regeneratePDF` is set to `true`
      operationId: billPdf
      parameters:
      - name: id
        in: path
        description: User ID to delete
        required: true
        schema:
          type: integer
          example: 12345
      - name: regeneratePDF
        in: query
        description: Regenerate an existing PDF
        required: false
        schema:
          type: boolean
          example: true
      - name: format
        in: query
        description: PDF Format
        required: false
        schema:
          type: string
          default: A4
          example: A4, 80mm or 58mm
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: boolean
                    example: false
                  uri:
                    type: string
                    example: https://some.link
                  format:
                    type: string
                    example: A4
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
      - Bearer: []
components:
