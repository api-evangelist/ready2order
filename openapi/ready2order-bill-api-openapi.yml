  /document/invoice/{id}/delete:
    post:
      tags:
      - Bill
      summary: Cancel an invoice
      description: Cancels an invoice by creating a cancellation (storno) bill that reverses its items and payments. By default the cancellation is paid back with the original invoice's payment method. An explicit paymentMethod_id and/or partPayments can be given to pay the cancellation back differently - see the description of those parameters for details.
      operationId: billDelete
      parameters:
      - name: id
        in: path
        description: ID of the invoice that should be cancelled
        required: true
        schema:
          type: integer
          example: 123456
      requestBody:
        content:
          application/json:
            schema:
              required:
              - storno_id
              - storno_reason
              properties:
                storno_id:
                  description: ID of the storno reason that justifies this cancellation. See `GET /storno` for the list of reasons.
                  type: integer
                  example: 9823
                storno_reason:
                  description: Free-text comment explaining why this specific invoice was cancelled. Stored on the cancellation bill alongside the storno reason referenced by `storno_id`.
                  type: string
                  example: Correction
                invoice_externalReferenceNumber:
                  description: External reference number to store on the cancellation bill.
                  type: string
                  example: REF-1234
                paymentMethod_id:
                  description: PaymentMethod ID to cancel the invoice with. If `partPayments` is also given, this payment method only covers the amount remaining after the part payments; otherwise it covers the entire cancellation amount. Defaults to the original invoice's payment method if not given.
                  type: integer
                  example: 123456
                partPayments:
                  description: List of part-payments to split the cancellation amount across multiple payment methods, analogous to `partPayments` on `PUT /document/invoice`. This defines a new payment breakdown for the cancellation and is independent of how the original invoice was actually paid - whenever `partPayments` and/or `paymentMethod_id` is given, the original invoice's payment breakdown is fully replaced. Any amount not covered by this list is cancelled with `paymentMethod_id` (or the original invoice's payment method, if `paymentMethod_id` is not given).
                  type: array
                  items:
                    properties:
                      paymentMethod_id:
                        description: PaymentMethod ID this part of the cancellation amount is paid back with
                        type: integer
                        example: 123456
                      amount:
                        description: Amount of the cancellation covered by this payment method
                        type: string
                        example: 5
                      tip:
                        description: Amount of tip to return via this payment method. The sum of tip across all partPayments must not exceed the original invoice's total tip - any remainder is returned via paymentMethod_id (or the original invoice's payment method, if not given).
                        type: string
                        example: 1
                      couponIdentifier:
                        description: Identifier of the coupon this part of the cancellation is redeemed against. Required when `paymentMethod_id` references a payment method of type coupon.
                        type: string
                        example: COUPON-123
                    type: object
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  invoice_id:
                    type: integer
                    example: 1234
                  invoice_reference_id:
                    type: integer
                    example: 1233
                  invoice_timestamp:
                    type: string
                    example: '2019-01-01 00:00:00'
                  invoice_number:
                    type: integer
                    example: 1
                  invoice_numberFull:
